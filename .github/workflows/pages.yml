name: Página
# Publica docs/apresentacao/index.html no GitHub Pages a cada push na main.
# Precisa do Pages ativado uma vez por quem administra o repositório:
# Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - docs/apresentacao/index.html
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # A página é um arquivo só, com CSS, JS e dados embutidos
      - run: |
          mkdir site
          cp docs/apresentacao/index.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
